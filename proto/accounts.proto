// AccountService: account CRUD and overviews (FUNCTIONAL_SPEC §7
// "Accounts", §9.3–§9.5). Positions within an account come from
// PositionService.ListPositions with an account filter.
syntax = "proto3";

package finance;

import "common.proto";

option java_package = "net.stewart.finance.proto";
option java_multiple_files = true;

message AccountSummary {
  int64 account_id = 1;
  int64 broker_id = 2;
  string broker_name = 3;
  string name = 4;
  string account_number = 5;
  // Account-owned currency (build-scope §5): every security held here
  // and the sweep balance are denominated in it.
  string currency_code = 6;
  // Tax-deferred accounts track position-level holdings with no lots
  // or basis and are excluded from the tax report (build-scope §1).
  bool tax_deferred = 7;
  FormattedMoney sweep_balance = 8; // account currency
  Provenance sweep_provenance = 9;
  FormattedMoney investment_value = 10; // account currency
  bool hidden = 11;
}

message ListAccountsRequest {
  int64 broker_id = 1; // 0 = accounts across all brokers
  bool include_hidden = 2;
}

message ListAccountsResponse {
  repeated AccountSummary accounts = 1;
  // Footer totals in the reporting currency, USD (build-scope §5).
  FormattedMoney total_investment_value = 2;
  FormattedMoney total_sweeps = 3;
}

message GetAccountRequest {
  int64 account_id = 1;
}

message GetAccountResponse {
  AccountSummary account = 1;
}

message CreateAccountRequest {
  int64 broker_id = 1;
  string name = 2;
  string account_number = 3;
  string currency_code = 4; // fixed at creation; holdings inherit it
  bool tax_deferred = 5;
}

message CreateAccountResponse {
  int64 account_id = 1;
}

message UpdateAccountRequest {
  int64 account_id = 1;
  string name = 2;
  string account_number = 3;
  bool tax_deferred = 4;
  // The hand-maintained cash balance (FUNCTIONAL_SPEC §9.4); imports
  // may also update it, with provenance (build-scope §1).
  Decimal sweep_balance = 5;
}

message UpdateAccountResponse {}

// Guard rail (§5.9): only an account with no lots or holdings can be
// deleted.
message DeleteAccountRequest {
  int64 account_id = 1;
}

message DeleteAccountResponse {}

// Guard rail (§5.9): hiding requires zero investment value.
message SetAccountHiddenRequest {
  int64 account_id = 1;
  bool hidden = 2;
}

message SetAccountHiddenResponse {}

service AccountService {
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc SetAccountHidden(SetAccountHiddenRequest) returns (SetAccountHiddenResponse);
}
