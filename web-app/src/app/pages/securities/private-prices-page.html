<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      Edit Privately Traded Price History for {{ ticker() }}
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="prices()">
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let p">{{ p.date?.display }}</td>
      </ng-container>
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef class="num">Price</th>
        <td mat-cell *matCellDef="let p" class="num">{{ p.price?.display }}</td>
      </ng-container>
      <ng-container matColumnDef="source">
        <th mat-header-cell *matHeaderCellDef>Source</th>
        <td mat-cell *matCellDef="let p">
          <span class="hidden-tag">{{ p.source || 'manual' }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let p" class="row-actions">
          <button matIconButton (click)="editPrice(p)" aria-label="Edit price">
            <mat-icon>edit</mat-icon>
          </button>
          <button matIconButton (click)="deletePrice(p)" aria-label="Delete price">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>

    @if (!prices().length) {
      <p class="empty-note">No prices yet - add the first with the button below.</p>
    }
  </mat-card-content>
  <mat-card-actions>
    <a matButton [routerLink]="['/securities', id()]">
      <mat-icon>arrow_back</mat-icon>
      Back to {{ ticker() }}
    </a>
  </mat-card-actions>
</mat-card>

<button matFab class="page-fab" aria-label="Add price" (click)="addPrice()">
  <mat-icon>add</mat-icon>
</button>
